// Selects re-render the section (they can show or hide other questions). Typed text
// does not: re-rendering on every keystroke threw the cursor out of the box.
function setAnswer(id, value, rerender = true) {
  state.answers[id] = value;
  if (!rerender) return;
  const section = getSection(state.sectionIdx);
  if (!section) return;
  if (section.questions.some(q => q.showIf)) renderSection(state.sectionIdx);
}

function toggleMulti(id, value, el) {
  if (!Array.isArray(state.answers[id])) state.answers[id] = [];
  const arr = state.answers[id];
  const i = arr.indexOf(value);
  if (i === -1) { arr.push(value); el.classList.add('checked'); }
  else { arr.splice(i, 1); el.classList.remove('checked'); }
}

// ── NAVIGATION ────────────────────────────────────────────────────────────────

function startAssessment() { renderSection(0); }

function goSection(idx) {
  // Going forward checks the section you're leaving. "Unknown" counts as an answer.
  if (state.phase === 'elicit' && idx > state.sectionIdx) {
    const missing = missingRequired(state.sectionIdx);
    if (missing.length) { showMissing(missing); return; }
  }
  renderSection(idx);
}

function showMissing(missing) {
  document.querySelectorAll('.question-block.missing').forEach(e => { e.classList.remove('missing'); e.style.outline = ''; });
  missing.forEach(q => {
    const el = document.getElementById('qblock-' + q.id);
    if (el) { el.classList.add('missing'); el.style.outline = '2px solid #e8a33d'; el.style.outlineOffset = '6px'; }
  });
  let note = document.getElementById('missing-note');
  if (!note) {
    note = document.createElement('div');
    note.id = 'missing-note';
    note.setAttribute('role', 'alert');
    note.style.cssText = 'margin:0 0 18px;padding:10px 14px;border:1px solid #e8a33d;border-radius:6px;font-size:14px';
    const header = document.querySelector('.section-header');
    if (header) header.after(note);
  }
  note.textContent = `${missing.length} required question${missing.length > 1 ? 's' : ''} still blank (outlined). "Unknown" is a fine answer.`;
  const first = document.getElementById('qblock-' + missing[0].id);
  if (first) first.scrollIntoView({ block: 'center' });
}

function goBack(currentIdx) {
  if (currentIdx === 0) { renderIntro(); return; }
  renderSection(currentIdx - 1);
}

function goToGenerate() {
  if (state.phase === 'elicit') {
    const missing = missingRequired(state.sectionIdx);
    if (missing.length) { showMissing(missing); return; }
    for (let i = 0; i < SECTIONS_META.length; i++) {
      if (missingRequired(i).length) { renderSection(i); showMissing(missingRequired(i)); return; }
    }
  }
  generateAssessment();
}

function startOver() {
  state.answers = {};
  state.report = null;
  state.sectionIdx = 0;
  renderIntro();
}

// ── AI WRITE-UP ───────────────────────────────────────────────────────────────
// The report is built from the rules first. The AI only adds the written parts; if
// it fails or gets cut off, the rule-based report still shows.

async function generateAssessment() {
  renderGenerating();
  const report = computeReport();
  state.report = report;

  try {
    report.ai = await askAi(report);
  } catch (err) {
    if (err.stop) { renderError(err.message); return; }
    // One retry: a cut-off or malformed reply usually comes back fine the second time.
    try { report.ai = await askAi(report); }
    catch (err2) {
      if (err2.stop) { renderError(err2.message); return; }
      report.aiProblem = err2.message || 'Something went wrong.';
    }
  }
  renderReport(report);
}

async function askAi(report) {
  {
    const res = await fetch('/api/synthesize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ purpose: 'report', tool: 'roi',
        max_tokens: 3500,
        system: buildSystemPrompt(),
        messages: [{ role: 'user', content: buildUserPrompt(report) }],
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const e = new Error(data.error || `Error ${res.status}`);
      // Paused, refused for patient data, rate-limited, too long: real stops, not AI hiccups. No retry.
      e.stop = res.status === 503 || !!data.phi || res.status === 429 || res.status === 413;
      throw e;
    }
    const text = (data.content || []).filter(b => b && b.type === 'text').map(b => b.text || '').join('');
    if (data.stop_reason === 'max_tokens') throw new Error('The write-up was cut off before it finished.');
    return parseAi(text);
  }
}

// The model sometimes drops a closing bracket (seen in about 1 of 4 real runs of
// one case, Nov 13). Close whatever is still open, outside strings, and try again.
function closeBrackets(s) {
  const stack = []; let inStr = false, esc = false;
  for (const ch of s) {
    if (inStr) { if (esc) esc = false; else if (ch === '\\') esc = true; else if (ch === '"') inStr = false; continue; }
    if (ch === '"') inStr = true;
    else if (ch === '{' || ch === '[') stack.push(ch);
    else if (ch === '}' || ch === ']') stack.pop();
  }
  if (inStr) return null;
  return s + stack.reverse().map(c => c === '{' ? '}' : ']').join('');
}

function parseJsonLoose(text) {
  const start = text.indexOf('{');
  if (start < 0) return null;
  const end = text.lastIndexOf('}');
  const candidates = [];
  if (end > start) candidates.push(text.slice(start, end + 1));
  // Dropped bracket in the middle: strip trailing closers, then re-close by count.
  if (end > start) {
    const trimmed = text.slice(start, end + 1).replace(/[\]}\s]+$/, '');
    const fixed = closeBrackets(trimmed);
    if (fixed) candidates.push(fixed);
  }
  const whole = closeBrackets(text.slice(start));
  if (whole) candidates.push(whole);
  for (const c of candidates) { try { return JSON.parse(c); } catch (e) { /* next */ } }
  return null;
}

function parseAi(text) {
  const obj = parseJsonLoose(text);
  if (!obj) throw new Error('The write-up came back unreadable.');
  // When a bracket was dropped, the closing fields can land inside "dimensions".
  const inner = obj.dimensions || {};
  if (obj.overallNarrative === undefined && typeof inner.overallNarrative === 'string') obj.overallNarrative = inner.overallNarrative;
  if (obj.recommendations === undefined && inner.recommendations !== undefined) obj.recommendations = inner.recommendations;
  if (!obj || typeof obj !== 'object') throw new Error('The write-up came back unreadable.');
  const clean = s => typeof s === 'string' ? s.trim() : '';
  const list = v => Array.isArray(v) ? v.map(clean).filter(Boolean).slice(0, 4) : [];
  const dims = {};
  DIMENSIONS.forEach(d => {
    const v = (obj.dimensions || {})[d.id] || {};
    dims[d.id] = { summary: clean(v.summary), strengths: list(v.strengths), gaps: list(v.gaps) };
  });
  return { dimensions: dims, overallNarrative: clean(obj.overallNarrative),
    recommendations: recsAllowed() ? list(obj.recommendations) : null };
}

function buildSystemPrompt() {
  return `You write the explanation parts of a value (ROI) assessment for a clinical AI system. Readers are governance committees, procurement teams and physician champions.

The ratings and the evidence map were already set by fixed rules from the organization's answers. They are given to you. Do not change, contradict, or re-grade them. A rating is the strength of the evidence for the value claims, not the size of the claims.

The six areas: clinical outcomes; operational; financial (what it saves minus what it costs, including the ongoing cost of checking the tool, and staff turnover in either direction); equity and harm; community; non-monetary (clinician and patient trust, buy-in, reputation).

For each area write:
- "summary": 1 to 2 plain sentences on what the answers show for this area.
- "strengths": 0 to 3 short items. Only what the answers actually show. Empty if nothing.
- "gaps": 1 to 3 short items, the most important missing evidence.
Then "overallNarrative": one short paragraph on how solid the value case is and the single most important thing to find out next.
Whether to write "recommendations" is stated at the end of the message.

Rules:
- Use only what is in the answers. Do not invent numbers, studies, vendors, regulations, or details.
- If the answers don't say, write "Can't tell from these answers." Do not fill gaps with typical cases.
- "Unknown" or "not answered" is not the same as "no". Don't turn an unknown into a finding that something is missing.
- Treat expected value, vendor claims, and impressions as unproven.
- Higher coding is revenue to the organization and cost to patients and payers. Never present it as value on its own.
- Time saved is gross until the time spent checking the tool's output is subtracted.
- Plain English. No markdown.

Return only this JSON, nothing before or after it:
{"dimensions":{"clinical":{"summary":"","strengths":[],"gaps":[]},"operational":{...},"financial":{...},"equity":{...},"community":{...},"nonmonetary":{...}},"overallNarrative":"","recommendations":null}`;
}

function buildUserPrompt(report) {
  const ans = state.answers;
  const fmt = v => blank(v) ? 'Not answered' : v;
  const fmtArr = v => Array.isArray(v) ? (v.length ? v.join(', ') : 'None selected') : fmt(v);
  const line = (label, v) => blank(v) ? '' : `${label}: ${Array.isArray(v) ? v.join(', ') : v}\n`;
  const recs = report.strategy.recs
    ? `RECOMMENDATIONS: requested. Give 3 to 5 next steps in "recommendations". Tie each to one of these strategic priorities and name it: ${fmtArr(ans.q_strategy_priorities)}. Frame them as options for the organization to decide on, not directives.`
    : `RECOMMENDATIONS: not requested. Set "recommendations" to null. Do not give recommendations anywhere else either.`;

  return `ASSESSMENT CONTEXT
System: ${fmt(ans.q_system)}
Pathway: ${fmt(ans.q_pathway)}
Use type: ${fmt(ans.q_use_type)}
Care setting: ${fmt(ans.q_setting)}
Role of assessor: ${fmt(ans.q_role)}
${line('Organization', ans.q_org)}${line('Deployment duration', ans.q_deployment_duration)}
ORGANIZATIONAL STRATEGY
Strategy status: ${fmt(ans.q_strategy)}
${line('Strategic priorities', ans.q_strategy_priorities)}${line('Adoption/sunset criteria in strategy', ans.q_strategy_criteria)}${line('Criteria description', ans.q_strategy_describe)}Value definition status: ${fmt(ans.q_roi_defined)}
${line('Payoff and re-check dates', ans.q_recheck)}
Stop-using point defined: ${fmt(ans.q_exit_threshold)}
${line('Stop-using point', ans.q_exit_describe)}
CLINICAL & OPERATIONAL VALUE
Expected clinical value: ${fmtArr(ans.q_clinical_expected)}
How clinical value was assessed: ${fmt(ans.q_clinical_status)}
${line('What that assessment showed', ans.q_clinical_result)}Expected operational value: ${fmtArr(ans.q_operational_expected)}
Operational impact assessed: ${fmt(ans.q_operational_status)}
Alert fatigue assessed: ${fmt(ans.q_alert_fatigue)}
${line('Baseline before go-live', ans.q_baseline)}${line('Share of licensed users who use it', ans.q_adoption)}${line('Where the saved time went', ans.q_time_went)}${line('Staff time spent checking its output', ans.q_check_hours)}${line('Who checks its output', ans.q_check_who)}Alert rate tracked: ${fmt(ans.q_alert_rate)}
Override rate tracked: ${fmt(ans.q_override_rate)}
${line('Documentation time saved (scribe)', ans.q_scribe_time)}${line('Note error review (scribe)', ans.q_scribe_quality)}${line('Recording consent (scribe)', ans.q_scribe_consent)}${line('Actions without approval (agent)', ans.q_agent_actions)}${line('Action logging (agent)', ans.q_agent_log)}
FINANCIAL VALUE
Approximate annual cost: ${fmt(ans.q_cost)}
Cost includes ongoing cost of checking the tool: ${fmt(ans.q_assurance_cost)}
Relevant financial value categories: ${fmtArr(ans.q_financial_categories)}
${line('Higher coding part of the value case', ans.q_coding_source)}${line('Coder audit of higher codes', ans.q_coding_audit)}${line('Clinicians see codes before claims go out', ans.q_coding_review)}${line('Cost of higher coding to patients/payers looked at', ans.q_coding_patient)}Financial analysis conducted: ${fmt(ans.q_financial_analysis)}
${line('Cost of leaving', ans.q_exit_cost)}${line('Compared with alternatives', ans.q_alternatives)}
Staff turnover dimension: ${fmt(ans.q_financial_turnover)}
Regulatory/compliance cost implications: ${fmt(ans.q_financial_regulatory)}

EQUITY, COMMUNITY & NON-MONETARY VALUE
Equity relevance: ${fmt(ans.q_equity_relevant)}
${line('Relevant populations', ans.q_equity_populations)}Subgroup analysis status: ${fmt(ans.q_equity_analysis)}
Patient harm tracking: ${fmt(ans.q_harm_tracked)}
Community benefit obligations: ${fmt(ans.q_community_benefit)}
Community/patient trust assessed: ${fmt(ans.q_community_trust)}
Community health impact assessed: ${fmt(ans.q_community_impact)}
Clinician trust level: ${fmt(ans.q_staff_trust)}
${line('Burnout/well-being surveyed', ans.q_burnout_measured)}Patient trust level: ${fmt(ans.q_patient_trust)}
Reputational posture: ${fmt(ans.q_reputation)}
${line('Non-monetary notes', ans.q_non_monetary_note)}
EVIDENCE QUALITY & DECISION CONTEXT
Assessor's overall evidence rating: ${fmt(ans.q_evidence_overall)}
${line('Biggest unknown', ans.q_biggest_unknown)}Decision-maker: ${fmt(ans.q_decision_maker)}
Decision timeline: ${fmt(ans.q_timeline)}
${line("Champion's core question", ans.q_champion_question)}${line('Stakeholder concerns', ans.q_opponents)}${line('Additional context', ans.q_context)}
RATINGS ALREADY SET BY RULES (do not change)
${report.dims.map(d => `${d.label}: ${RATING_LABEL[d.rating]}. ${d.why}`).join('\n')}

FLAGS ALREADY SET BY RULES (the reader sees these separately; don't repeat them word for word)
${report.flags.join('\n') || 'none'}

EVIDENCE MAP ALREADY SET BY RULES
Measured: ${report.map.measured.join('; ') || 'nothing'}
Assumed: ${report.map.assumed.join('; ') || 'nothing'}
Unknown: ${report.map.unknown.join('; ') || 'nothing'}

${recs}`;
}

function copyReportText() {
  const r = state.report;
  if (!r) return;
  const ai = r.ai || {};
  let text = `ROI ASSESSMENT — ${r.system}\nGenerated: ${r.date} · ROI Assessment v${TOOL_VERSION}\n`;
  text += `Working prototype · not independently reviewed · not clinical, legal or financial advice. Ratings and the evidence map come from fixed rules; parts marked [AI] were written by AI.\n\n`;
  text += `${r.strategy.note}\n\n`;
  if (r.flags.length) text += `WHAT YOUR ANSWERS FLAG\n${r.flags.map(f => '- ' + f).join('\n')}\n\n`;
  r.dims.forEach(d => {
    text += `${d.label}: ${RATING_LABEL[d.rating]}\nWhy: ${d.why}\n`;
    const a = (ai.dimensions || {})[d.id];
    if (a && a.summary) text += `[AI] ${a.summary}\n`;
    if (a && a.gaps && a.gaps.length) text += `[AI] Gaps: ${a.gaps.join('; ')}\n`;
    text += '\n';
  });
  text += `EVIDENCE MAP\nMeasured: ${r.map.measured.join('; ') || 'nothing'}\nAssumed: ${r.map.assumed.join('; ') || 'nothing'}\nUnknown: ${r.map.unknown.join('; ') || 'nothing'}\n\n`;
  if (ai.overallNarrative) text += `[AI] OVERALL\n${ai.overallNarrative}\n\n`;
  if (r.strategy.recs && ai.recommendations && ai.recommendations.length) text += `[AI] RECOMMENDATIONS\n${ai.recommendations.map((x, i) => `${i + 1}. ${x}`).join('\n')}\n`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copy-btn');
    if (btn) { btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = 'Copy report text'; }, 2000); }
  }).catch(() => {});
}

function escHtml(str) {
  if (str === undefined || str === null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
