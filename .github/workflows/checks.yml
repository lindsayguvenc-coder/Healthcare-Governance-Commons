name: Commons checks

# Mechanical drift checks on every pull request and push to main.
# Fails the check if a node is missing from the map, a link goes nowhere,
# a data file falls out of sync, or the regulatory layer goes stale.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 15 * * 1"   # Mondays, so staleness shows up even without a PR
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Drift checks
        run: node scripts/check.mjs
      - name: PR guards (disclaimers, privacy inventory, outside scripts, secrets, decisions)
        run: node scripts/pr-guards.mjs
        # Repository variable SITE_QC_PR=warn shows failures without failing the
        # check (docs/site-qc-switches.md). Unset or "enforce": failures fail it.
        continue-on-error: ${{ vars.SITE_QC_PR == 'warn' }}
      - name: Build
        run: npm install --no-audit --no-fund && npm run build
