name: Branch cleanup (one time)

# One-time cleanup, Nov 16, 2026. Deletes 62 old branches whose work is
# already in main. Run it once from the Actions tab, then this file gets
# removed in a follow-up PR.
#
# Safety:
# - Only the branches listed below, by name. main and data-archive (the
#   Weekly backup branch) are never touched, even if someone adds them here.
# - Each branch is deleted only if its last commit is still the one checked
#   on Nov 16. A branch with anything new on it is skipped and reported.
# - You have to type DELETE when you run it, or it stops.
# - Any deleted branch can be restored from its commit ID (listed below).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE to delete the 62 branches"
        required: true
        default: ""

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Delete the old branches
        run: |
          if [ "$CONFIRM" != "DELETE" ]; then
            echo "::error::You didn't type DELETE, so nothing was deleted."
            exit 1
          fi
          deleted=0; gone=0; skipped=0; failed=0
          {
            echo "## Branch cleanup"
            echo
            echo "| Branch | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r name sha; do
            [ -z "$name" ] && continue
            case "$name" in
              main|data-archive)
                echo "| $name | never deleted (protected) |" >> "$GITHUB_STEP_SUMMARY"; continue ;;
            esac
            current=$(gh api "repos/$REPO/git/ref/heads/$name" --jq .object.sha 2>/dev/null || true)
            if [ -z "$current" ]; then
              gone=$((gone+1)); echo "| $name | already gone |" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$current" != "$sha" ]; then
              skipped=$((skipped+1)); echo "| $name | SKIPPED: has new commits since Nov 16 |" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::$name has new commits, skipped"
            elif gh api -X DELETE "repos/$REPO/git/refs/heads/$name" >/dev/null; then
              deleted=$((deleted+1)); echo "| $name | deleted (was $sha) |" >> "$GITHUB_STEP_SUMMARY"
            else
              failed=$((failed+1)); echo "| $name | FAILED to delete |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::could not delete $name"
            fi
          done <<'LIST'
