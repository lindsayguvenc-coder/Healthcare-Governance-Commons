name: Site QC agents

# Batch 4 of the Site QC crosswalk (scripts/site-agents.mjs): the AI agents.
#   C3 Regulatory scan, weekly. In "on" mode, findings come as a pull request
#      for Lindsay. This workflow never merges it.
#   C4 Claims and sources audit, monthly. Read-only: an issue, never an edit.
#   S2 AI tools stay in their lane, weekly. A grader on fixed tricky prompts.
#   C5 Library versions, weekly: newer versions, final releases, next editions
#      and moved pages for library.json and toolbox.json links. A pull request.
#      Moves are looked for three ways: each page's top against last run's
#      (the "library-tops" download, pulled before the run and saved after),
#      a closed-book AI reader over every page, and a word pattern.
#   C6 Library additions, weekly: documents that meet the library criteria
#      and aren't in yet, by node. A pull request.
# Each agent runs its planted test first; a miss means don't trust its all-clear.
# A missing, expired or out-of-credit key is a failure, never a quiet skip.
#
# The off switch (docs/site-qc-switches.md): SITE_QC_AGENTS overrides
# SITE_QC_MODE for this workflow only; unset means off. SITE_QC_SKIP=C3,C4,S2,C5,C6
# leaves agents out. The key is the SITE_QC_ANTHROPIC_KEY secret, separate from
# the site's own key in Vercel.

on:
  schedule:
    - cron: "47 15 * * 1"   # Mondays 15:47 UTC = 7:47 AM Pacific: C3, S2, C5 and C6, before the Monday review
    - cron: "53 15 1 * *"   # the 1st of each month, 15:53 UTC: C4
  workflow_dispatch:
    inputs:
      agents:
        description: "Which agents (comma list of C3, C4, S2, C5, C6)"
        default: "C3,C4,S2,C5,C6"
      fake:
        description: "Fake AI replies only (no key, no spend): good, misses, or blank for real"
        default: ""
      pages_only:
        description: "Library pages only: type yes to read every library page, compare its top with last run's, and print what was seen (no AI, no spend; the agents box is ignored)"
        default: ""

permissions:
  contents: write        # C3's findings branch
  issues: write
  pull-requests: write   # C3, C5 and C6 open PRs (needs "Allow GitHub Actions to create pull requests" in Settings → Actions)
  actions: read          # C5 pulls last run's page tops (the "library-tops" download)

jobs:
  agents:
    runs-on: ubuntu-24.04
    timeout-minutes: 45   # Mondays now run C3, S2, C5 and C6 together
    env:
      MODE: ${{ vars.SITE_QC_AGENTS || vars.SITE_QC_MODE || 'off' }}
      SITE_QC_SKIP: ${{ vars.SITE_QC_SKIP }}
      SITE_QC_AGENT_MODEL: ${{ vars.SITE_QC_AGENT_MODEL }}
      SITE_QC_C5_BLOCK: ${{ vars.SITE_QC_C5_BLOCK }}
      SITE_QC_C5_TOP_CHARS: ${{ vars.SITE_QC_C5_TOP_CHARS }}
      SITE_QC_C5_TOP_IGNORE: ${{ vars.SITE_QC_C5_TOP_IGNORE }}
      SITE_QC_C5_READER_CHARS: ${{ vars.SITE_QC_C5_READER_CHARS }}
      CHROME: /usr/bin/google-chrome
      WHICH: ${{ inputs.agents || (github.event.schedule == '53 15 1 * *' && 'C4' || 'C3,S2,C5,C6') }}
    steps:
      - name: Switch is ${{ env.MODE }}
        run: |
          case "$MODE" in
            off) echo "::notice::Site QC agents are switched off (MODE=off). Nothing ran and nothing was spent. Turn on with SITE_QC_AGENTS or SITE_QC_MODE: quiet or on." ;;
            quiet) echo "::notice::Quiet mode: the agents run and the log is kept, but no issue or pull request is opened and no email is sent." ;;
            on) echo "On: failures open or update one issue; C3 findings come as a pull request." ;;
            *) echo "::error::Unknown MODE '$MODE'. Use off, quiet or on."; exit 1 ;;
          esac

      - uses: actions/checkout@v5
        if: env.MODE != 'off'
      - uses: actions/setup-node@v5
        if: env.MODE != 'off'
        with:
          node-version: 20

      - name: Install (the lane check drives the real pages)
        if: env.MODE != 'off'
        run: |
          npm install --no-audit --no-fund
          (cd tests/replay && PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-audit --no-fund --no-save playwright && npx playwright install ffmpeg)

      - name: Last run's page tops (C5 layer 1's baseline)
        # The newest "library-tops" download from an earlier run. None, or a
        # failed pull, means layer 1 says so in its results; it's never skipped quietly.
        if: env.MODE != 'off' && (inputs.fake || '') == '' && (inputs.pages_only == 'yes' || contains(env.WHICH, 'C5'))
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          a=$(gh api "repos/$REPO/actions/artifacts?name=library-tops&per_page=30" --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | reverse | .[0] // empty | "\(.workflow_run.id) \(.created_at)"')
          if [ -z "$a" ]; then echo "::warning::No saved page tops from an earlier run, so C5 layer 1 has nothing to compare against this time. It says so in its results, and this run's tops are saved for next time."; exit 0; fi
          set -- $a
          gh run download "$1" -R "$REPO" -n library-tops -D qc-out/baseline
          echo "Baseline: page tops saved by run $1 ($2)."

      - name: Library pages only (no AI)
        if: env.MODE != 'off' && inputs.pages_only == 'yes'
        run: node scripts/site-agents.mjs --pages-only

      - name: Run the agents (${{ env.WHICH }})
        if: env.MODE != 'off' && inputs.pages_only != 'yes'
        id: run
        env:
          SITE_QC_ANTHROPIC_KEY: ${{ (inputs.fake || '') == '' && secrets.SITE_QC_ANTHROPIC_KEY || '' }}
          SITE_QC_FAKE_AI: ${{ (inputs.fake || '') != '' && format('tests/site-qc/agents/fake-{0}.json', inputs.fake) || '' }}
          SITE_QC_VIDEO: qc-out/video
        run: node scripts/site-agents.mjs --only "$WHICH"
        continue-on-error: true

      - name: Keep the log, the reports and the replay
        if: always() && env.MODE != 'off'
        uses: actions/upload-artifact@v4
        with:
          name: site-agents-${{ github.run_id }}
          path: qc-out/
          retention-days: 180

      - name: Save this run's page tops for next time (C5 layer 1)
        if: always() && env.MODE != 'off' && (inputs.fake || '') == '' && hashFiles('qc-out/library-tops.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: library-tops
          path: qc-out/library-tops.json
          retention-days: 90

      - name: Results on this page
        if: always() && env.MODE != 'off'
        run: |
          f=qc-out/site-agents.json
          {
            echo "## Site QC agents ($MODE mode)"
            if [ "${{ inputs.pages_only }}" = "yes" ]; then echo "Library pages only: see the log of the step above."; exit 0; fi
            if [ ! -f "$f" ]; then echo "The agents didn't finish. See the log above."; exit 0; fi
            jq -r '"Model: \(.model)\(if .fake then " (fake replies: a test run)" else "" end) · key: \(.key)"' "$f"
            echo
            jq -r '.results[] | select(.level != "ok") | "- **" + .level + "** " + (if .kind=="control" then "[control] " else "" end) + .id + " · " + .check + (if (.detail // "") != "" then " — " + .detail else "" end)' "$f"
            echo
            echo "Nothing above means everything passed."
            for r in qc-out/regulatory-scan.md qc-out/claims-audit.md qc-out/library-versions.md qc-out/library-additions.md; do if [ -f "$r" ]; then echo; cat "$r"; fi; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Findings as pull requests, one per report (never merged here)
        if: always() && env.MODE == 'on' && (inputs.fake || '') == '' && hashFiles('qc-out/site-agents.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "Site QC agents"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          start=$(git rev-parse HEAD); day=$(date -u +%F)
          # id  report  folder  title  what to do
          pr() {
            id=$1; rep=$2; dir=$3; title=$4; todo=$5
            [ -f "qc-out/$rep.md" ] || return 0
            n=$(jq --arg id "$id" '[.results[] | select(.id==$id and .kind=="check" and (.check|test("^[0-9]+ .*\\(s\\) to review")))][0].check // "0" | capture("^(?<n>[0-9]+)").n | tonumber' qc-out/site-agents.json)
            missed=$(jq --arg id "$id" '[.results[] | select(.id==$id and .kind=="control" and .level=="fail")] | length' qc-out/site-agents.json)
            if [ "${n:-0}" -eq 0 ]; then echo "$id: nothing to review, no pull request."; return 0; fi
            branch="$dir/$day"
            git switch -q -c "$branch" "$start"
            mkdir -p "docs/$dir" && cp "qc-out/$rep.md" "docs/$dir/$day.md"
            git add "docs/$dir/$day.md" && git commit -qm "$title $day: $n to review"
            git push -q origin "$branch"
            warn=""; [ "$missed" -gt 0 ] && warn="**The planted test was missed this run: don't trust this report.** "
            gh pr create --base main --head "$branch" --title "$title $day: $n to review" --body "${warn}${todo} Close it when done. Run: $RUN @lindsayguvenc-coder" \
              || echo "::error::Couldn't open the $id pull request. Turn on Settings → Actions → General → Allow GitHub Actions to create and approve pull requests. The report is in the run's download."
            git switch -q --detach "$start"
          }
          pr C3 regulatory-scan regulatory-scan "Regulatory scan" "C3 found these against src/data/regulatory.json. Nothing in the site changes from this PR: read each source, then edit the data file yourself (new entries as \"verified\": false until read)."
          pr C5 library-versions library-versions "Library versions" "C5 found these against src/data/library.json and toolbox.json. Nothing in the site changes from this PR: read each source, then edit the data files yourself per docs/library-criteria.md (a source that changes status keeps its entry; a superseded one moves to retired)."
          pr C6 library-additions library-additions "Library additions" "C6 proposes these for src/data/library.json. Nothing in the site changes from this PR: open each document, check it's the original, then add the ones you want yourself."

      - name: Open, update or close the issue
        # fake runs are tests: they never open an issue or a pull request
        if: always() && env.MODE == 'on' && (inputs.fake || '') == '' && inputs.pages_only != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title_prefix="Site agents:"
          open=$(gh issue list -R "$REPO" --state open --search "\"$title_prefix\" in:title" --json number --jq '.[0].number // empty')
          f=qc-out/site-agents.json
          if [ ! -f "$f" ]; then
            title="$title_prefix agents didn't run (Today)"; body="The Site QC agents didn't finish, so nothing was checked. Run log: $RUN @lindsayguvenc-coder"
          else
            site=$(jq '.failedSite' "$f"); ctl=$(jq '.failedControls' "$f")
            if [ "$site" -eq 0 ] && [ "$ctl" -eq 0 ]; then
              if [ -n "$open" ]; then gh issue close "$open" -R "$REPO" --comment "The agents pass. Closing. $RUN"; fi
              echo "All clear."; exit 0
            fi
            fails=$(jq -r '.results[] | select(.level=="fail") | "- " + (if .kind=="control" then "**[control]** " else "" end) + .id + " · " + .check + (if .detail != "" then " — " + .detail else "" end)' "$f")
            warns=$(jq -r '.results[] | select(.level=="warn") | "- " + .id + " · " + .check + (if .detail != "" then " — " + .detail else "" end)' "$f")
            if [ "$ctl" -gt 0 ]; then what="$ctl planted test(s) were missed: an agent is broken, so don't trust its all-clear lines until it's fixed."; else what="$site finding(s) need you."; fi
            title="$title_prefix $((site + ctl)) need you (This week)"
            body="$what

          $fails

          Also worth a look:
          $warns

          Reports, run log and CSV for the Agent Fleet QC page: $RUN @lindsayguvenc-coder"
          fi
          if [ -n "$open" ]; then gh issue edit "$open" -R "$REPO" --title "$title"; gh issue comment "$open" -R "$REPO" --body "$body"
          else gh issue create -R "$REPO" --title "$title" --body "$body"; fi

      - name: Mark the run failed if anything failed
        if: env.MODE == 'on' && steps.run.outcome == 'failure'
        run: exit 1
