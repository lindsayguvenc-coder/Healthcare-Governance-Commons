name: Site health (daily)

# Batch 1 of the Site QC crosswalk: plain-code checks against the live site,
# every morning. scripts/site-health.mjs has the checks and their seeded
# controls (planted cases with a known answer, so a broken checker shows up).
#
# If anything fails it opens (or updates) one GitHub issue, which emails
# Lindsay. It says whether the site failed or the checker did. When everything
# passes again, it closes the issue. The run log and a CSV for the Agent Fleet
# QC page are kept as a download on each run.

on:
  schedule:
    - cron: "23 14 * * *"   # 14:23 UTC = 6:23 AM Pacific (7:23 in summer)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-24.04
    env:
      SITE: https://healthcare-governance-commons.vercel.app
      # The switch (docs/site-qc-switches.md). Repository variables, set in
      # Settings > Secrets and variables > Actions > Variables. Unset means off.
      MODE: ${{ vars.SITE_QC_DAILY || vars.SITE_QC_MODE || 'quiet' }}
      SITE_QC_SKIP: ${{ vars.SITE_QC_SKIP }}
    steps:
      - name: Switch is ${{ env.MODE }}
        run: |
          case "$MODE" in
            off) echo "::notice::Site health (daily) is switched off (MODE=off). Nothing was checked. Turn it on with the SITE_QC_MODE repository variable: quiet or on." ;;
            quiet) echo "::notice::Quiet mode: checks run and the log is kept, but no issue is opened and no email is sent." ;;
            on) echo "On: checks run; failures open or update one GitHub issue, which emails Lindsay." ;;
            *) echo "::error::Unknown MODE '$MODE'. Use off, quiet or on."; exit 1 ;;
          esac

      - uses: actions/checkout@v5
        if: env.MODE != 'off'
      - uses: actions/setup-node@v5
        if: env.MODE != 'off'
        with:
          node-version: 20

      - name: Run the checks
        if: env.MODE != 'off'
        id: run
        run: node scripts/site-health.mjs
        continue-on-error: true

      - name: Keep the log
        if: always() && env.MODE != 'off'
        uses: actions/upload-artifact@v4
        with:
          name: site-health-${{ github.run_id }}
          path: qc-out/
          retention-days: 90

      - name: Quiet mode, results on this page only
        if: always() && env.MODE == 'quiet'
        run: |
          f=qc-out/site-health.json
          {
            echo "## Quiet mode: no issue opened, no email"
            if [ -f qc-out/site-browser.json ] && [ "$f" = "qc-out/site-weekly.json" ]; then extra=qc-out/site-browser.json; else extra=; fi
            if [ ! -f "$f" ]; then echo "The checks didn't finish. See the log above."; exit 0; fi
            echo
            jq -r '.results[] | select((.level // (if .ok then "ok" else "fail" end)) != "ok") | "- **" + (.level // "fail") + "** " + (if .kind=="control" then "[control] " else "" end) + .id + " · " + .check + (if (.detail // "") != "" then " — " + .detail else "" end)' "$f" $extra
            echo
            echo "Nothing above means everything passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update or close the issue
        if: always() && env.MODE == 'on'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title_prefix="Site health:"
          open=$(gh issue list -R "$REPO" --state open --search "\"$title_prefix\" in:title" --json number --jq '.[0].number // empty')
          if [ ! -f qc-out/site-health.json ]; then
            body="The site health check didn't finish, so nothing was checked today. That's a failure of the checker, not necessarily the site. Run log: $RUN @lindsayguvenc-coder"
            title="$title_prefix checker didn't run (Now)"
          else
            site=$(jq '.failedSite' qc-out/site-health.json)
            ctl=$(jq '.failedControls' qc-out/site-health.json)
            if [ "$site" -eq 0 ] && [ "$ctl" -eq 0 ]; then
              if [ -n "$open" ]; then gh issue close "$open" -R "$REPO" --comment "All checks pass and every planted control was caught. Closing. $RUN"; fi
              echo "All clear."; exit 0
            fi
            list=$(jq -r '.results[] | select(.ok|not) | "- " + (if .kind=="control" then "**[control]** " else "" end) + .id + " · " + .check + (if .detail != "" then " — " + .detail else "" end)' qc-out/site-health.json)
            if [ "$ctl" -gt 0 ]; then
              what="$ctl planted control(s) were not caught, so the checker or the protection it tests is broken. Treat this like a reject: don't trust today's all-clear lines until it's fixed."
            else
              what="$site check(s) failed on the live site."
            fi
            title="$title_prefix $((site + ctl)) failing (Now)"
            body="$what

          $list

          Run log and CSV for the Agent Fleet QC page: $RUN

          This issue closes itself the first morning everything passes. @lindsayguvenc-coder"
          fi
          if [ -n "$open" ]; then
            gh issue edit "$open" -R "$REPO" --title "$title"
            gh issue comment "$open" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --title "$title" --body "$body"
          fi

      - name: Mark the run failed if anything failed
        if: env.MODE == 'on' && (steps.run.outcome == 'failure')
        run: exit 1
