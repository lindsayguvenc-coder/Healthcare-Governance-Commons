name: Site checks (weekly)

# Batch 3 of the Site QC crosswalk. Plain-code part (scripts/site-weekly.mjs): outside links, the Validation Protocol
# Generator's fixed test case (live site vs this repo vs the saved
# fingerprint), as-of dates, known holes in packages, and the contribution
# reviewers' agreement, stranded commits. Browser part
# (scripts/site-browser.mjs): script errors and outside requests on every page,
# accessibility and phone width against a saved baseline, the protocol PDF, and
# the Local Validation Kit sending nothing. Both carry seeded controls.
#
# Failures, or a planted control that wasn't caught, open (or update) one
# GitHub issue, which emails Lindsay; warnings ride along in it. When a week
# passes clean, it closes the issue.

on:
  schedule:
    - cron: "37 15 * * 1"   # Mondays 15:37 UTC = 7:37 AM Pacific, before the Monday review
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  weekly:
    runs-on: ubuntu-24.04
    env:
      SITE: https://healthcare-governance-commons.vercel.app
      # The switch (docs/site-qc-switches.md). Repository variables, set in
      # Settings > Secrets and variables > Actions > Variables. Unset means off.
      MODE: ${{ vars.SITE_QC_WEEKLY || vars.SITE_QC_MODE || 'off' }}
      SITE_QC_SKIP: ${{ vars.SITE_QC_SKIP }}
      LOCAL: http://localhost:3000
    steps:
      - name: Switch is ${{ env.MODE }}
        run: |
          case "$MODE" in
            off) echo "::notice::Site checks (weekly) is switched off (MODE=off). Nothing was checked. Turn it on with the SITE_QC_MODE repository variable: quiet or on." ;;
            quiet) echo "::notice::Quiet mode: checks run and the log is kept, but no issue is opened and no email is sent." ;;
            on) echo "On: checks run; failures open or update one GitHub issue, which emails Lindsay." ;;
            *) echo "::error::Unknown MODE '$MODE'. Use off, quiet or on."; exit 1 ;;
          esac

      - uses: actions/checkout@v5
        if: env.MODE != 'off'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        if: env.MODE != 'off'
        with:
          node-version: 20

      - name: Install, build, and start this repo's copy of the API
        if: env.MODE != 'off'
        run: |
          npm install --no-audit --no-fund
          npm run build
          (cd tests/replay && npm install --no-audit --no-fund --no-save ioredis-mock@8 playwright jspdf@2.5.1 axe-core@4)
          (cd tests/replay && nohup node server.js ../.. 3000 > /tmp/local-api.log 2>&1 &)
          sleep 3

      - name: Run the checks
        if: env.MODE != 'off'
        id: run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/site-weekly.mjs
        continue-on-error: true

      - name: Run the browser checks (pages, accessibility, PDF, the kit)
        if: env.MODE != 'off'
        id: browser
        env:
          CHROME: /usr/bin/google-chrome
        run: node scripts/site-browser.mjs
        continue-on-error: true

      - name: Keep the log
        if: always() && env.MODE != 'off'
        uses: actions/upload-artifact@v4
        with:
          name: site-weekly-${{ github.run_id }}
          path: qc-out/
          retention-days: 180

      - name: Quiet mode, results on this page only
        if: always() && env.MODE == 'quiet'
        run: |
          f=qc-out/site-weekly.json
          {
            echo "## Quiet mode: no issue opened, no email"
            if [ -f qc-out/site-browser.json ] && [ "$f" = "qc-out/site-weekly.json" ]; then extra=qc-out/site-browser.json; else extra=; fi
            if [ ! -f "$f" ]; then echo "The checks didn't finish. See the log above."; exit 0; fi
            echo
            jq -r '.results[] | select((.level // (if .ok then "ok" else "fail" end)) != "ok") | "- **" + (.level // "fail") + "** " + (if .kind=="control" then "[control] " else "" end) + .id + " · " + .check + (if (.detail // "") != "" then " — " + .detail else "" end)' "$f" $extra
            echo
            echo "Nothing above means everything passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update or close the issue
        if: always() && env.MODE == 'on'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title_prefix="Site weekly:"
          open=$(gh issue list -R "$REPO" --state open --search "\"$title_prefix\" in:title" --json number --jq '.[0].number // empty')
          # one combined view of the plain-code and browser checks
          if [ -f qc-out/site-weekly.json ] && [ -f qc-out/site-browser.json ]; then
            jq -s '{failedSite: (.[0].failedSite + .[1].failedSite), failedControls: (.[0].failedControls + .[1].failedControls), results: (.[0].results + .[1].results)}' qc-out/site-weekly.json qc-out/site-browser.json > qc-out/combined.json
            mv qc-out/combined.json qc-out/site-weekly.json
          elif [ -f qc-out/site-weekly.json ]; then
            jq '.results += [{"level":"fail","kind":"check","id":"F1","check":"Browser checks did not finish","detail":"see the run log"}] | .failedSite += 1' qc-out/site-weekly.json > qc-out/c.json && mv qc-out/c.json qc-out/site-weekly.json
          fi
          if [ ! -f qc-out/site-weekly.json ]; then
            title="$title_prefix checker didn't run (Today)"
            body="The weekly site checks didn't finish, so nothing was checked this week. Run log: $RUN @lindsayguvenc-coder"
          else
            site=$(jq '.failedSite' qc-out/site-weekly.json)
            ctl=$(jq '.failedControls' qc-out/site-weekly.json)
            if [ "$site" -eq 0 ] && [ "$ctl" -eq 0 ]; then
              if [ -n "$open" ]; then gh issue close "$open" -R "$REPO" --comment "This week's checks pass. Closing. $RUN"; fi
              echo "All clear."; exit 0
            fi
            fails=$(jq -r '.results[] | select(.level=="fail") | "- " + (if .kind=="control" then "**[control]** " else "" end) + .id + " · " + .check + (if .detail != "" then " — " + .detail else "" end)' qc-out/site-weekly.json)
            warns=$(jq -r '.results[] | select(.level=="warn") | "- " + .id + " · " + .check + (if .detail != "" then " — " + .detail else "" end)' qc-out/site-weekly.json)
            if [ "$ctl" -gt 0 ]; then what="$ctl planted control(s) were not caught: a checker is broken, so don't trust its all-clear lines until it's fixed."; else what="$site check(s) failed."; fi
            title="$title_prefix $((site + ctl)) failing (This week)"
            body="$what

          $fails

          Also worth a look (warnings):
          $warns

          Run log and CSV for the Agent Fleet QC page: $RUN

          Closes itself the first week everything passes. @lindsayguvenc-coder"
          fi
          if [ -n "$open" ]; then
            gh issue edit "$open" -R "$REPO" --title "$title"
            gh issue comment "$open" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --title "$title" --body "$body"
          fi

      - name: Mark the run failed if anything failed
        if: env.MODE == 'on' && (steps.run.outcome == 'failure' || steps.browser.outcome == 'failure')
        run: exit 1
